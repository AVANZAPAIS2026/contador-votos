<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contador de votos en tiempo real" />
    <title>Contador de votos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main>
        <section class="summary-grid" aria-label="Resumen de resultados">
          <article class="summary-card summary-card--accent">
            <div class="card-label"><span class="label-dot"></span>Total de votos</div>
            <div class="summary-value" id="total-votes">0</div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Actas contabilizadas</div>
            <div class="summary-value"><span id="counted-tables">0</span><small>/ 422</small></div>
            <div class="progress-track" role="progressbar" aria-label="Porcentaje de actas contabilizadas" aria-valuemin="0" aria-valuemax="422" aria-valuenow="0"><span id="counted-progress"></span></div>
            <div class="progress-caption"><span id="counted-percent">0%</span></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Votos en blanco</div>
            <div class="summary-value"><span id="blank-votes">0</span></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Votos N/V</div>
            <div class="summary-value"><span id="null-invalid-votes">0</span></div>
          </article>
        </section>

        <section class="results-section" aria-labelledby="results-title">
          <div class="section-heading">
            <div>
              <h2 id="results-title">Porcentaje por candidatura</h2>
            </div>
            <p class="data-status" id="data-status" role="status" aria-live="polite"></p>
          </div>

          <div class="results-list" id="results-list" aria-live="polite"></div>
        </section>

      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
