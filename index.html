<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contador de votos en tiempo real" />
    <title>Contador de votos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <main>
        <section class="summary-grid" aria-label="Resumen de resultados">
          <article class="summary-card summary-card--accent">
            <div class="card-label"><span class="label-dot"></span>Total de votos</div>
            <div class="summary-value" id="total-votes">0</div>
            <div class="trend trend--up"><span>↑</span> <span id="votes-this-minute">+0</span></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Mesas escrutadas</div>
            <div class="summary-value"><span id="counted-tables">0</span><small>/ 1.240</small></div>
            <div class="progress-track" aria-label="Porcentaje de mesas escrutadas"><span id="counted-progress"></span></div>
            <div class="progress-caption"><span id="counted-percent">0%</span></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Participación</div>
            <div class="summary-value"><span id="participation">0</span><small>%</small></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Votos blancos</div>
            <div class="summary-value"><span id="blank-votes">0</span><small>%</small></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Votos nulos</div>
            <div class="summary-value"><span id="null-votes">0</span><small>%</small></div>
          </article>
          <article class="summary-card">
            <div class="card-label"><span class="label-dot label-dot--muted"></span>Votos viciados</div>
            <div class="summary-value"><span id="invalid-votes">0</span><small>%</small></div>
          </article>
        </section>

        <section class="results-section" aria-labelledby="results-title">
          <div class="section-heading">
            <div>
              <h2 id="results-title">Porcentaje por candidato</h2>
            </div>
          </div>

          <div class="results-list" id="results-list" aria-live="polite"></div>
        </section>

      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
